# omacosy-borders — ring styling. Reload: it re-reads on file change.
width=3
# Concentric rule: for the ring to hug a window corner, its radius must
# be the WINDOW's corner radius + width/2 (the stroke centerline sits
# half a stroke outside the window edge). Radii below were MEASURED
# from live window alpha (2026-08-13): macOS 26 standard windows are
# ~14pt (Arc, Slack, Signal, Spotify), Korren ~13pt.
radius=15
# per-app corner radius overrides (frontmost app name, as in cmd-tab;
# invisible format characters in names are ignored):
radius:Korren=14
# WhatsApp draws a custom ~10pt corner
radius:WhatsApp=11
