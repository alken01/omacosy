# OmniWM settings for the omacosy experiment (branch: omniwm).
# Symlinked to ~/.config/omniwm/settings.toml; OmniWM live-reloads it.
# Schema follows OmniWM's own persisted model — edit in the GUI and the
# file round-trips, or edit here and it applies on save.
#
# First pass, mapped from the AeroSpace world:
# - dwindle layout with our measured splitWidthMultiplier (1.4 restores
#   the 16:9 left/down/left cadence on a 3440-wide display)
# - focus follows mouse is OmniWM-native (retires omacosy-ffm here)
# - 4-finger workspace swipes are OmniWM-native (retires aerospace-swipe)
# - OmniWM's workspace bar and borders stay OFF: omacosy-bar and
#   omacosy-borders remain the themed chrome
# - update checks off, matching the repo's nothing-phones-home posture
# - hotkeys: Super = Caps Lock = Control+Option+Command (Karabiner),
#   same letters as the omarchy scheme where ids exist

[general]
defaultLayoutType = "dwindle"
animationsEnabled = true
hotkeysEnabled = true
ipcEnabled = true
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = false

[dwindle]
defaultSplitRatio = 1.0
smartSplit = false
splitWidthMultiplier = 1.4
singleWindowFit = "fill"
useGlobalGaps = true

[focus]
followsMouse = true
followsWindowToMonitor = true
crossesMonitorAtEdge = true
moveCrossesMonitorAtEdge = true
moveMouseToFocusedWindow = false
lockModifier = "off"

[gaps]
size = 8.0

[gaps.outer]
top = 0.0
bottom = 0.0
left = 0.0
right = 0.0

[gestures]
workspaceSwipeEnabled = true
workspaceSwipeFingerCount = 4
workspaceSwipeAxis = "horizontal"
scrollEnabled = false
fingerCount = 3
mouseResizeModifierKey = "option"

[mouseWarp]
enabled = true
constrainToArrangement = false
margin = 1

[borders]
enabled = false

[workspaceBar]
enabled = false

[statusBar]
showAppNames = false
showWorkspaceName = false
useWorkspaceId = true

[clipboard]
historyEnabled = false

[quakeTerminal]
enabled = false

[hiddenBar]
enabled = false

[appearance]
mode = "automatic"

[routing]
mode = "macOS"

# --- hotkeys: omarchy's map, Super = Control+Option+Command -----------------
# switchWorkspace is 0-indexed: id .0 answers the "1" key.

[[hotkeys]]
binding = "Control+Option+Command+1"
id = "switchWorkspace.0"

[[hotkeys]]
binding = "Control+Option+Command+2"
id = "switchWorkspace.1"

[[hotkeys]]
binding = "Control+Option+Command+3"
id = "switchWorkspace.2"

[[hotkeys]]
binding = "Control+Option+Command+4"
id = "switchWorkspace.3"

[[hotkeys]]
binding = "Control+Option+Command+5"
id = "switchWorkspace.4"

[[hotkeys]]
binding = "Control+Option+Command+6"
id = "switchWorkspace.5"

[[hotkeys]]
binding = "Control+Option+Command+7"
id = "switchWorkspace.6"

[[hotkeys]]
binding = "Control+Option+Command+8"
id = "switchWorkspace.7"

[[hotkeys]]
binding = "Control+Option+Command+9"
id = "switchWorkspace.8"

[[hotkeys]]
binding = "Control+Option+Command+Shift+1"
id = "moveToWorkspace.0"

[[hotkeys]]
binding = "Control+Option+Command+Shift+2"
id = "moveToWorkspace.1"

[[hotkeys]]
binding = "Control+Option+Command+Shift+3"
id = "moveToWorkspace.2"

[[hotkeys]]
binding = "Control+Option+Command+Shift+4"
id = "moveToWorkspace.3"

[[hotkeys]]
binding = "Control+Option+Command+Shift+5"
id = "moveToWorkspace.4"

[[hotkeys]]
binding = "Control+Option+Command+Shift+6"
id = "moveToWorkspace.5"

[[hotkeys]]
binding = "Control+Option+Command+Shift+7"
id = "moveToWorkspace.6"

[[hotkeys]]
binding = "Control+Option+Command+Shift+8"
id = "moveToWorkspace.7"

[[hotkeys]]
binding = "Control+Option+Command+Shift+9"
id = "moveToWorkspace.8"

[[hotkeys]]
binding = "Control+Option+Command+B"
id = "workspaceBackAndForth"

[[hotkeys]]
binding = "Control+Option+Command+Left Arrow"
id = "focus.left"

[[hotkeys]]
binding = "Control+Option+Command+Right Arrow"
id = "focus.right"

[[hotkeys]]
binding = "Control+Option+Command+Up Arrow"
id = "focus.up"

[[hotkeys]]
binding = "Control+Option+Command+Down Arrow"
id = "focus.down"

# Super+tab / Super+shift+tab — next/previous workspace, per display
# (switchWorkspaceRelative walks this monitor's set, like omacosy-ws).

[[hotkeys]]
binding = "Control+Option+Command+Tab"
id = "switchWorkspace.next"

[[hotkeys]]
binding = "Control+Option+Command+Shift+Tab"
id = "switchWorkspace.previous"

# Super+shift+arrows — move the window; crosses to the other monitor at the
# screen edge (focus.moveCrossesMonitorAtEdge above), which covers most of
# omarchy's directional throwing too.

[[hotkeys]]
binding = "Control+Option+Command+Shift+Left Arrow"
id = "move.left"

[[hotkeys]]
binding = "Control+Option+Command+Shift+Right Arrow"
id = "move.right"

[[hotkeys]]
binding = "Control+Option+Command+Shift+Up Arrow"
id = "move.up"

[[hotkeys]]
binding = "Control+Option+Command+Shift+Down Arrow"
id = "move.down"

# Super+t toggle floating, Super+j toggle split direction (dwindle),
# Super+f fullscreen-in-workspace, Super+n native macOS fullscreen.

[[hotkeys]]
binding = "Control+Option+Command+T"
id = "toggleFocusedWindowFloating"

[[hotkeys]]
binding = "Control+Option+Command+J"
id = "toggleSplit"

[[hotkeys]]
binding = "Control+Option+Command+F"
id = "toggleFullscreen"

[[hotkeys]]
binding = "Control+Option+Command+N"
id = "toggleNativeFullscreen"

# Super+- / Super+= — resize steps (dwindle's resizeFocusedWindow).

[[hotkeys]]
binding = "Control+Option+Command+Minus"
id = "resizeFocusedWindow.shrink"

[[hotkeys]]
binding = "Control+Option+Command+Equal"
id = "resizeFocusedWindow.grow"

# omarchy chords with no OmniWM hotkey id (checked against
# Sources/OmniWM/Core/Input/{ActionCatalog,HotkeyCommand}.swift, 2026-08-25):
# - Super+w close window: HotkeyCommand has no close/quit-window case at all.
# - Super+shift+o throw the window to the other display in one keypress: only
#   directional moveWindowToMonitor.{left,right,up,down} exist, no
#   "other/next monitor" variant (edge-crossing move.* above is the stand-in).
# - Super+shift+space throw the WHOLE workspace to the other display: same
#   story — only directional moveWorkspaceToMonitor.* / swapWorkspaceWithMonitor.*.

# --- workspaces: 1-9 on the main display, 14-17 on the secondary ------------
# OmniWM workspace ids are positive-integer strings with no upper bound
# (WorkspaceIDPolicy.normalizeRawID in Sources/OmniWMIPC/WorkspaceAddressing.swift),
# so two-digit ids like "14" are valid. BUT app rules only land on workspaces
# that are configured here: PlacementResolver.resolveWorkspacePlacement looks
# the rule's workspace up with createIfMissing:false and skips the rule as
# workspaceNotMaterialized otherwise, and WorkspaceManager.createWorkspace
# refuses any name outside the configured set. The built-in default configures
# only "1"-"7" (BuiltInSettingsDefaults.workspaceConfigurations) — and
# supplying [[workspaces]] REPLACES that default (SettingsStore.
# normalizedWorkspaceConfigurations), so 1-9 are restated for the hotkeys
# above and 14-17 added for the app pins, on the omacosy secondary-set
# convention. layoutType "default" follows general.defaultLayoutType.

[[workspaces]]
id = "006FFC60-64D0-466B-80B2-7A57332DCA5C"
name = "1"
monitorAssignment = { type = "main" }
layoutType = "default"

[[workspaces]]
id = "6198A7C7-C06F-4F13-850E-6E0010A5621A"
name = "2"
monitorAssignment = { type = "main" }
layoutType = "default"

