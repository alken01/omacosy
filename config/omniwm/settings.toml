# --- appRules: messengers/media pinned to the secondary-set workspaces ------
# assignToWorkspace takes a raw workspace id string; only bundleId is a
# required field (AppRule's custom decoder, Sources/OmniWM/Core/Config/
# AppRule.swift — rule ids regenerate on load when omitted).

[[appRules]]
bundleId = "org.whispersystems.signal-desktop"
assignToWorkspace = "14"

[[appRules]]
bundleId = "net.whatsapp.WhatsApp"
assignToWorkspace = "15"

[[appRules]]
bundleId = "com.hnc.Discord"
assignToWorkspace = "16"

[[appRules]]
bundleId = "com.spotify.client"
assignToWorkspace = "17"
