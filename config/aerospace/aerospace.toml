# AeroSpace — i3-like tiling for macOS with omarchy's keybinding scheme.
# "Super" = Caps Lock, remapped by Karabiner to cmd+ctrl+alt — a combo
# nothing on macOS uses, so bindings never collide with typing or apps.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

start-at-login = true
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Tell sketchybar which workspace is focused
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
outer.top = 42  # room for sketchybar

# Fixed-size settings windows fight the tiler (resize -> snap back ->
# relayout flicker); float them instead.
[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Apps with a fixed home: messengers on 8, music on 9 (laptop display)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 9'

# Omarchy's map, Super = Caps Lock (cmd-ctrl-alt). Two layers, like
# omarchy: Super for window management, Super+Shift for moving and apps.
[mode.main.binding]
# Terminal / browser (omarchy: Super+Return, Super+Shift+Return)
cmd-ctrl-alt-enter = 'exec-and-forget open -na Korren'
cmd-ctrl-alt-shift-enter = 'exec-and-forget open -a Arc'

# Launcher (omarchy: Super+Space)
cmd-ctrl-alt-space = 'exec-and-forget open -a Raycast'

# Close window (omarchy: Super+W)
cmd-ctrl-alt-w = 'close'

# Focus (omarchy: Super+Arrows)
cmd-ctrl-alt-left = 'focus left'
cmd-ctrl-alt-down = 'focus down'
cmd-ctrl-alt-up = 'focus up'
cmd-ctrl-alt-right = 'focus right'

# Move windows (omarchy: Super+Shift+Arrows)
cmd-ctrl-alt-shift-left = 'move left'
cmd-ctrl-alt-shift-down = 'move down'
cmd-ctrl-alt-shift-up = 'move up'
cmd-ctrl-alt-shift-right = 'move right'

# Layout (omarchy: Super+T float toggle, Super+J split toggle, Super+F fullscreen)
cmd-ctrl-alt-t = 'layout floating tiling'
cmd-ctrl-alt-j = 'layout tiles horizontal vertical'
cmd-ctrl-alt-f = 'fullscreen --no-outer-gaps'
# native (green-button) fullscreen: the only mode that may claim the
# notch strip on the built-in display; deliberate enter/exit only
cmd-ctrl-alt-n = 'macos-native-fullscreen'

# Resize (omarchy: Super+Minus / Super+Equal)
cmd-ctrl-alt-minus = 'resize smart -50'
cmd-ctrl-alt-equal = 'resize smart +50'

# Workspaces (omarchy: Super+N, Super+Shift+N, Super+Tab)
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'

cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9'

cmd-ctrl-alt-tab = 'workspace-back-and-forth'
cmd-ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Apps (omarchy: Super+Shift+letter)
cmd-ctrl-alt-shift-f = 'exec-and-forget open ~'          # files
cmd-ctrl-alt-shift-m = 'exec-and-forget open -a Spotify' # music
cmd-ctrl-alt-shift-s = 'exec-and-forget open -a Slack'   # slack

# Theme cycle (T for theme; float lives on plain Super+T)
cmd-ctrl-alt-shift-t = 'exec-and-forget $HOME/.local/bin/theme-next'

# Modes
cmd-ctrl-alt-r = 'mode resize'
cmd-ctrl-alt-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']  # reset layout
backspace = ['close-all-windows-but-current', 'mode main']

# Portable monitor roles instead of hardware names: 1-6 on the main
# display, 7-9 on the secondary. On a single display everything falls
# back to main; on any two-display setup the split follows the user's
# primary-display choice rather than specific hardware.
[workspace-to-monitor-force-assignment]
1 = ['main']
2 = ['main']
3 = ['main']
4 = ['main']
5 = ['main']
6 = ['main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']
